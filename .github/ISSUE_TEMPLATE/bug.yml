name: Bug report
description: Report reproducible incorrect or unsafe behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: plugin
    attributes:
      label: Plugin and version
      description: Name the plugin and its version or commit.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Agent platform
      options:
        - Claude Code
        - OpenAI Codex
        - GitHub Copilot
        - Cursor
        - Other
    validations:
      required: true
  - type: input
    id: platform-version
    attributes:
      label: Platform version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove secrets and confidential data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and workaround
