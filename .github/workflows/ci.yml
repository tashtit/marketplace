name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with: { node-version-file: '.nvmrc', cache: 'npm' }

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Run script unit tests
        run: npm test

      # Blocks a pull request that pulls in a vulnerable or non-allowlisted
      # dependency, complementing the reviewed-record rule `npm run validate`
      # enforces above. Dependency review compares the base and head dependency
      # graphs, which exist only for a pull request, so the step is skipped on
      # push and manual dispatch. It also requires a public repository or
      # GitHub Advanced Security; if that stops holding, the step is meant to
      # fail loudly rather than be conditioned away into silence. Kept last so
      # a denied dependency never hides the validation and test results a
      # contributor also needs.
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: 'high'
          allow-licenses: '0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0, ISC, MIT, MPL-2.0, Unlicense'
          comment-summary-in-pr: 'never'
